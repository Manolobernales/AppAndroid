name: Build and publish FirmaPDF

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build APK and publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android platform and build tools
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Name APK for download
        run: cp app/build/outputs/apk/debug/app-debug.apk FirmaPDF-Android-v0.6.0.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: FirmaPDF 0.6.0
          target_commitish: ${{ github.sha }}
          body: |
            FirmaPDF 0.6.0 para Android.

            Funciones: firma manuscrita sobre PDF, posicionamiento táctil, nombre del firmante, registro JSON complementario y envío mediante el menú nativo de Android.

            Nota: no es una firma digital certificada. Requiere conexión a internet para cargar las bibliotecas PDF.
          files: FirmaPDF-Android-v0.6.0.apk
          overwrite_files: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
