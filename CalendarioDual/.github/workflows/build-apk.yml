name: Build Calendario Dual APK
on:
  workflow_dispatch:
  push:
    branches: [ calendario-dual ]
    paths: [ 'CalendarioDual/**' ]
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CalendarioDual
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CalendarioDual-debug-apk
          path: CalendarioDual/app/build/outputs/apk/debug/app-debug.apk
